<style>
  html, body { height: 100%; }
  body { -webkit-tap-highlight-color: transparent; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }
  button { -webkit-tap-highlight-color: transparent; }

  /* ---------- iPhone frame (desktop) ---------- */
  .device { width: 399px; height: 836px; padding: 12px; border-radius: 60px; background: #111318;
            box-shadow: 0 30px 80px rgba(17,19,24,.35), inset 0 0 0 2px #2a2d33; }
  .screen { width: 375px; height: 812px; border-radius: 48px; }

  /* ---------- Full-screen on real phones ---------- */
  @media (max-width: 440px) {
    body { background: #F5F6F8 !important; }
    .stage { padding: 0 !important; min-height: 100%; }
    .device { width: 100vw; height: 100dvh; padding: 0; border-radius: 0; box-shadow: none; background: transparent; }
    .screen { width: 100vw; height: 100dvh; border-radius: 0; }
    .island, .home-indicator-frame { display: none; }
    /* 모바일: 휴대폰의 실제 상태바를 쓰므로 프로토타입 상태바는 숨김 */
    #statusbar { display: none; }
    #view { padding-top: env(safe-area-inset-top, 0px) !important; }
    #banner { top: calc(env(safe-area-inset-top, 0px) + 8px); }
  }

  /* ---------- 데모 시나리오: PC는 프레임 좌측 패널 / 모바일은 홈 하단 ---------- */
  .demo-side, .demo-spacer { display: none; }
  @media (min-width: 760px) {
    .demo-side { display: flex; }
    .demo-spacer { display: block; }
    .demo-inapp { display: none !important; }
  }

  /* ---------- Tab bar glass edge ---------- */
  .glass-edge { position: relative; }
  .glass-edge::before { content: ''; position: absolute; inset: 0; border-radius: inherit; padding: 1px; pointer-events: none;
    background: linear-gradient(to bottom, #fff 0%, rgba(255,255,255,0) var(--edge-stop, 100%));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude; }

  .toast { opacity: 0; transform: translate(-50%, 8px); transition: all .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .banner { transform: translateY(calc(-100% - 70px)); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
  .banner.show { transform: translateY(0); }

  .sheet { transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
  .sheet.open { transform: translateY(0); }
  .dim { opacity: 0; transition: opacity .25s; }
  .dim.open { opacity: 1; }

  .fade-in { animation: fadeIn .22s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .pulse-dot { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }

  .radar span { position: absolute; inset: 0; border-radius: 9999px; border: 2px solid #E96E0A; opacity: 0; animation: ping 2s ease-out infinite; }
  .radar span:nth-child(2) { animation-delay: .65s; }
  .radar span:nth-child(3) { animation-delay: 1.3s; }
  @keyframes ping { 0% { transform: scale(.35); opacity: .9; } 100% { transform: scale(1.25); opacity: 0; } }

  .spin { animation: spin 1s linear infinite; }
  .road-dash { stroke-dasharray: 14 18; animation: dash .5s linear infinite; animation-play-state: paused; }
  .playing .road-dash { animation-play-state: running; }
  @keyframes dash { to { stroke-dashoffset: -32; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  input, textarea { font-family: inherit; }
  input:focus, textarea:focus { outline: none; }

  /* report paper table */
  .rpt th, .rpt td { padding: 6px 4px; border-bottom: 1px solid #ECEFF3; text-align: left; vertical-align: top; }
  .rpt th { font-weight: 700; color: #626B76; font-size: 10px; background: #F5F6F8; }
  .rpt td { font-size: 10.5px; color: #20262D; }
  .rpt .r { text-align: right; }
</style>

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const pad = n => String(n).padStart(2, '0');
const fmtKm = n => (Math.round(n * 10) / 10).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtOdo = n => Math.round(n).toLocaleString('en-US');
const DOW = ['일','월','화','수','목','금','토'];
function parseD(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(s, withDow = true) { const d = parseD(s); return `${d.getMonth()+1}월 ${d.getDate()}일${withDow ? ` (${DOW[d.getDay()]})` : ''}`; }
function fmtDot(s) { const d = parseD(s); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`; }
function addMin(hm, m) { let [h, mm] = hm.split(':').map(Number); let t = h*60 + mm + Math.round(m); return `${pad(Math.floor(t/60)%24)}:${pad(t%60)}`; }
function ymLabel(ym) { const [y,m] = ym.split('-'); return `${y}년 ${Number(m)}월`; }
function rng(seed) { return function() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------- i18n (한국어 / English) ----------------
   화면은 한국어로 작성하고, 영어 선택 시 렌더된 DOM의 한글 텍스트를 사전(I18N)·패턴(I18N_RULES)으로 치환합니다.
   새 문구를 추가하면 I18N 사전에도 영문을 함께 추가해 주세요. */
const HANGUL = /[가-힣ㄱ-ㆎ]/;
const MISSING = new Set();
let PHRASES = null;
function trCore(c) {
  if (!HANGUL.test(c)) return c;
  if (I18N[c] != null) return I18N[c];
  for (const [re, fn] of I18N_RULES) { const m = c.match(re); if (m) return fn(...m); }
  if (!PHRASES) PHRASES = Object.entries(I18N).filter(([k]) => k.length >= 2).sort((a, b) => b[0].length - a[0].length);
  let out = c;
  for (const [re, fn] of I18N_INLINE) out = out.replace(re, fn);
  for (const [k, v] of PHRASES) if (out.includes(k)) out = out.split(k).join(v);
  if (HANGUL.test(out)) MISSING.add(c);
  return out;
}
function tr(s) {
  if (S.lang !== 'en' || s == null || !HANGUL.test(s)) return s;
  const lead = s.match(/^\s*/)[0], trail = s.match(/\s*$/)[0];
  return lead + trCore(s.trim()) + trail;
}
function trTree(root) {
  if (S.lang !== 'en' || !root) return;
  if (root.nodeType === 3) { if (!root.parentElement || root.parentElement.closest('script,style,.lang-toggle')) return; const v = tr(root.nodeValue); if (v !== root.nodeValue) root.nodeValue = v; return; }
  if (root.nodeType !== 1) return;
  const skip = el => !el || el.closest('script,style,.lang-toggle');
  if (skip(root)) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => skip(n.parentElement) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  let n; const list = [];
  while ((n = w.nextNode())) if (HANGUL.test(n.nodeValue)) list.push(n);
  list.forEach(n => { n.nodeValue = tr(n.nodeValue); });
  const els = [root, ...root.querySelectorAll('[placeholder],[aria-label],[title],input,textarea')];
  els.forEach(e => {
    ['placeholder', 'aria-label', 'title'].forEach(a => { const v = e.getAttribute && e.getAttribute(a); if (v && HANGUL.test(v)) e.setAttribute(a, tr(v)); });
    if ((e.tagName === 'INPUT' || e.tagName === 'TEXTAREA') && HANGUL.test(e.value) && !e.dataset.typed) e.value = tr(e.value);
  });
}
new MutationObserver(ms => {
  if (S.lang !== 'en') return;
  ms.forEach(m => m.type === 'characterData' ? trTree(m.target) : m.addedNodes.forEach(trTree));
}).observe(document.documentElement, { subtree: true, childList: true, characterData: true });
document.addEventListener('input', e => { if (e.target.matches('input,textarea')) e.target.dataset.typed = '1'; }, true);

function setLang(l) {
  if (S.lang === l) return;
  S.lang = l;
  try { localStorage.setItem('fbt_lang', l); } catch (e) {}
  try { const u = new URL(location.href); if (l === 'en') u.searchParams.set('lang', 'en'); else u.searchParams.delete('lang'); history.replaceState(null, '', u); } catch (e) {}
  applyLangMeta();
  $('sheet').classList.remove('open'); $('sheetDim').classList.remove('open'); $('sheetWrap').classList.add('hidden');
  render(true);
  trTree(document.body);
}
function applyLangMeta() {
  document.documentElement.lang = S.lang;
  document.title = S.lang === 'en' ? 'FINE FBT · Car Logbook Prototype' : 'FINE FBT · 운행일지 프로토타입';
}

function LangToggle(size = 'md') {
  const b = (l, label) => `<button onclick="setLang('${l}')" class="flex-1 ${size === 'sm' ? 'h-[34px] text-[13px]' : 'h-[40px] text-[14px]'} rounded-full font-bold transition-colors ${S.lang === l ? 'bg-ink text-white' : 'text-sub'}" data-lang="${l}">${label}</button>`;
  return `<div class="lang-toggle flex p-[3px] rounded-full bg-white border border-line ${size === 'sm' ? 'w-[200px]' : 'w-full'}">${b('ko', '한국어')}${b('en', 'English')}</div>`;
}

let TRIPS = [];
(function genTrips() {
  const R = rng(20261028);
  let odo = 46120.0, seq = 1;
  const add = (date, from, to, start, purpose, cat) => {
    const km = Math.round(dist(from, to) * (1 + (R() - 0.5) * 0.08) * 10) / 10;
    const mins = km * 1.9 + 6 + R() * 6;
    TRIPS.push({ id: 't' + (seq++), date, from, to, start, end: addMin(start, mins), km, odoStart: odo, odoEnd: Math.round((odo + km) * 10) / 10, purpose, cat, memo: '' });
    odo = Math.round((odo + km) * 10) / 10;
  };
  const d = new Date(2026, 7, 1), end = parseD(TODAY);
  while (d <= end) {
    const ds = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const wd = d.getDay();
    if (wd >= 1 && wd <= 5) {
      const m = 30 + Math.floor(R() * 20);
      add(ds, 'home', 'hq', `07:${pad(m)}`, 'private', '출퇴근');
      if (ds === TODAY) break;                       // 오늘은 오전 출근까지만 기록됨
      if (R() < 0.7) {
        const dest = ['cA', 'site', 'wh'][Math.floor(R() * 3)];
        const cat = { cA: '고객 방문', site: '현장 점검', wh: '물품 배송' }[dest];
        add(ds, 'hq', dest, `10:${pad(10 + Math.floor(R() * 40))}`, 'business', cat);
        add(ds, dest, 'hq', `13:${pad(Math.floor(R() * 50))}`, 'business', cat);
      }
      add(ds, 'hq', 'home', `18:${pad(Math.floor(R() * 40))}`, 'private', '출퇴근');
    } else if (R() < 0.6) {
      const dest = R() < 0.65 ? 'shop' : 'beach';
      const h = 10 + Math.floor(R() * 4);
      add(ds, 'home', dest, `${pad(h)}:${pad(Math.floor(R() * 50))}`, 'private', '개인 용무');
      add(ds, dest, 'home', `${pad(h + 3)}:${pad(Math.floor(R() * 50))}`, 'private', '개인 용무');
    }
    d.setDate(d.getDate() + 1);
  }
  // 최근 운행 일부는 아직 목적이 분류되지 않은 상태(미분류)
  TRIPS.filter(t => t.date === '2026-10-27' && t.start >= '18:00').forEach(t => { t.purpose = null; t.cat = ''; });
  TRIPS.filter(t => t.date === TODAY).forEach(t => { t.purpose = null; t.cat = ''; });
})();

function stats(ym) {
  const list = TRIPS.filter(t => t.date.startsWith(ym));
  const sum = f => list.filter(f).reduce((a, t) => a + t.km, 0);
  const total = sum(() => true), biz = sum(t => t.purpose === 'business'), pri = sum(t => t.purpose === 'private'), unc = sum(t => !t.purpose);
  const uncCount = list.filter(t => !t.purpose).length;
  const pct = total ? Math.round(biz / total * 1000) / 10 : 0;
  const odoStart = list.length ? list[0].odoStart : 0, odoEnd = list.length ? list[list.length - 1].odoEnd : 0;
  return { list, total, biz, pri, unc, uncCount, pct, count: list.length, odoStart, odoEnd };
}

function MapSvg(seed, h = 180) {
  const R = rng(seed);
  const pts = []; let x = 40, y = h - 36;
  for (let i = 0; i < 6; i++) { pts.push([x, y]); x += 45 + R() * 10; y = Math.max(30, Math.min(h - 30, y - 10 - R() * 40 + (i % 2 ? 22 : 0))); }
  pts.push([310, 34]);
  const roads = Array.from({ length: 7 }, (_, i) => `<path d="M${-20 + i * 60} ${h} L${40 + i * 60} 0" stroke="#E3E7EC" stroke-width="7"/>`).join('') +
                Array.from({ length: 4 }, (_, i) => `<path d="M0 ${30 + i * 45} L343 ${10 + i * 45}" stroke="#E3E7EC" stroke-width="5"/>`).join('');
  const [sx, sy] = pts[0], [ex, ey] = pts[pts.length - 1];
  return `<svg viewBox="0 0 343 ${h}" width="100%" height="${h}" class="block" preserveAspectRatio="xMidYMid slice">
    <rect width="343" height="${h}" fill="#EEF1F4"/>${roads}
    <path d="M250 ${h} q30 -40 93 -50 v50z" fill="#D7E6F3"/>
    <polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#E96E0A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${sx}" cy="${sy}" r="7" fill="#fff" stroke="#20262D" stroke-width="3"/>
    <circle cx="${ex}" cy="${ey}" r="8" fill="#E96E0A" stroke="#fff" stroke-width="3"/>
  </svg>`;
}

      </div>

          ${cats.map(c => `<button onclick="psCat('${c}')" class="h-[36px] px-[14px] rounded-full text-[13px] font-bold border ${PS.cat === c ? 'bg-ink text-white border-ink' : 'bg-white text-ink border-line'}">${c}</button>`).join('')}
        </div>
        ${PS.purpose === 'private' ? `<p class="text-[12px] text-sub leading-[17px] bg-page rounded-[10px] px-3 py-[10px]">자택↔근무지 출퇴근은 FBT 기준 개인(사적) 사용으로 분류돼요.</p>` : ''}
        <input id="psMemo" value="${esc(PS.memo)}" oninput="PS.memo=this.value" placeholder="메모 (선택) · 예: ○○사 납품 미팅" class="h-[48px] rounded-[12px] bg-white border border-line px-4 text-[14px] text-ink placeholder:text-[#A3AAB3]" />
      </div>` : ''}
      <div class="flex flex-col gap-2 pt-1">
        <button onclick="psSave()" ${PS.purpose ? '' : 'disabled'} class="w-full h-[54px] rounded-[14px] bg-brand text-white text-[16px] font-bold disabled:bg-[#F3C9A6]">저장</button>
        ${PS.auto ? `<button onclick="psLater()" class="h-[44px] text-[14px] font-bold text-sub">나중에 선택</button>` : ''}
      </div>
    </div>`, { locked: PS.auto });
}
function psPick(p) { if (PS.purpose !== p) PS.cat = ''; PS.purpose = p; if (!PS.cat) PS.cat = CATS[p][0]; keepMemo(); redrawSheet(); }
function psCat(c) { PS.cat = c; keepMemo(); redrawSheet(); }
function keepMemo() { const m = $('psMemo'); if (m) PS.memo = m.value; }
function redrawSheet() { const sc = $('sheet').scrollTop; drawPurposeSheet(); $('sheet').scrollTop = sc; }
function psSave() {
  keepMemo();
  const t = TRIPS.find(x => x.id === PS.id);
  t.purpose = PS.purpose; t.cat = PS.cat; t.memo = PS.memo; delete t.fresh;
  closeSheet();
  toast(`${PS.purpose === 'business' ? '업무용' : '개인용'} 운행으로 저장했어요`);
  PS = null; refresh();
}
function psLater() { closeSheet(); toast('미분류로 저장했어요. 운행기록에서 언제든 선택할 수 있어요'); PS = null; refresh(); }

function validAbn(a) {

const durMin = t => { const [a, b] = [t.start, t.end].map(s => s.split(':').map(Number)); return (b[0] * 60 + b[1]) - (a[0] * 60 + a[1]); };
const TYPE_LABEL = { drive: '주행 영상', event: '주행 충격', park: '주차 충격' };
const clipLabel = c => `${c.date.slice(5).replace('-', '/')} ${c.time} ${TYPE_LABEL[c.type]}`;

function clipsAll() {
  const out = [];
  TRIPS.filter(t => t.date >= RET_FROM).forEach(t => {
    const d = Math.max(1, durMin(t)), n = Math.max(1, Math.min(4, Math.round(d / 12)));
    for (let i = 0; i < n; i++) out.push({ id: `${t.id}-${i}`, date: t.date, time: addMin(t.start, d * i / n), type: 'drive', tripId: t.id, loc: i < n / 2 ? PL[t.from].n : PL[t.to].n });
    if (t.impact) out.push({ id: `${t.id}-x`, date: t.date, time: t.impact.time, type: 'event', event: true, tripId: t.id, loc: PL[t.to].n, g: t.impact.g });
  });
  PARK_CLIPS.forEach(c => out.push(c));
  return out.filter(c => !DELETED.has(c.id)).sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
}
const clipById = id => clipsAll().find(c => c.id === id);

function bbPlay() {

  PLAY.playing = !PLAY.playing;
  p.classList.toggle('playing', PLAY.playing);
  $('pbtn').innerHTML = PLAY.playing ? I.pause('#20262D', 20) : I.playFill('#20262D', 20);
  $('pbtn').style.opacity = PLAY.playing ? '0' : '1';
  clearInterval(PLAY.timer);
  if (PLAY.playing) PLAY.timer = setInterval(() => {
    PLAY.pos = Math.min(60, PLAY.pos + 1);
    const b = $('pbar'), t = $('ptime');
    if (!b) { clearInterval(PLAY.timer); return; }
    b.style.width = (PLAY.pos / 60 * 100) + '%';
    t.textContent = t.textContent.slice(0, 5) + ':' + pad(PLAY.pos % 60);
    if (PLAY.pos >= 60) { PLAY.pos = 0; bbPlay(); }
  }, 250);
}

    </div>`}

};
function bbStartUpdate() {
  UPD = { phase: 'run', pct: 0, timer: null };
  refresh();
  UPD.timer = setInterval(() => {
    UPD.pct = Math.min(100, UPD.pct + 3.5);
    if (cur() === 'bbUpdate') {
      const b = $('updBar'), t = $('updPct');
      if (b) b.style.width = UPD.pct + '%';
      if (t) t.textContent = Math.round(UPD.pct) + '%';
      if ([45.5, 87.5].some(x => Math.abs(UPD.pct - x) < 1.8)) refresh();
    }
    if (UPD.pct >= 100) {
      clearInterval(UPD.timer);
      const v = myVehicle(); if (v) { v.fw = LATEST_FW; v.updateReq = false; }
      notifsOf(S.me.id).forEach(n => { if (n.type === 'firmware') n.read = true; });
      UPD.phase = 'done';
      if (cur() === 'bbUpdate') render(true);
      toast('펌웨어 업데이트를 완료했어요');
    }
  }, 120);
}

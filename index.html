  .device { width: 399px; height: 836px; padding: 12px; border-radius: 60px; background: #111318;

  .glass-edge { position: relative; }

  .toast { opacity: 0; transform: translate(-50%, 8px); transition: all .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  .banner { transform: translateY(calc(-100% - 70px)); transition: transform .35s cubic-bezier(.2,.8,.2,1); }

  .sheet { transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }

  .dim { opacity: 0; transition: opacity .25s; }
  .dim.open { opacity: 1; }

  @keyframes ping { 0% { transform: scale(.35); opacity: .9; } 100% { transform: scale(1.25); opacity: 0; } }

/* ---------------- Helpers ---------------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
const pad = n => String(n).padStart(2, '0');
const fmtKm = n => (Math.round(n * 10) / 10).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtOdo = n => Math.round(n).toLocaleString('en-US');
const DOW = ['일','월','화','수','목','금','토'];
function parseD(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function fmtDate(s, withDow = true) { const d = parseD(s); return `${d.getMonth()+1}월 ${d.getDate()}일${withDow ? ` (${DOW[d.getDay()]})` : ''}`; }
function fmtDot(s) { const d = parseD(s); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`; }
function addMin(hm, m) { let [h, mm] = hm.split(':').map(Number); let t = h*60 + mm + Math.round(m); return `${pad(Math.floor(t/60)%24)}:${pad(t%60)}`; }
function ymLabel(ym) { const [y,m] = ym.split('-'); return `${y}년 ${Number(m)}월`; }
function rng(seed) { return function() { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------------- Mock data ---------------- */
const TODAY = '2026-10-28';
const NOW_HM = '14:16';

const DIST = { 'home|hq': 23.8, 'hq|cA': 11.2, 'hq|site': 14.6, 'hq|wh': 27.3, 'home|shop': 3.1, 'home|beach': 31.5 };
const dist = (a, b) => DIST[`${a}|${b}`] ?? DIST[`${b}|${a}`] ?? 10;

const CATS = {
  business: ['고객 방문', '현장 점검', '회의·미팅', '물품 배송', '기타 업무'],
  private:  ['출퇴근', '개인 용무', '기타 개인'],

let TRIPS = [];
(function genTrips() {
  const R = rng(20261028);
  let odo = 46120.0, seq = 1;
  const add = (date, from, to, start, purpose, cat) => {
    const km = Math.round(dist(from, to) * (1 + (R() - 0.5) * 0.08) * 10) / 10;
    const mins = km * 1.9 + 6 + R() * 6;
    TRIPS.push({ id: 't' + (seq++), date, from, to, start, end: addMin(start, mins), km, odoStart: odo, odoEnd: Math.round((odo + km) * 10) / 10, purpose, cat, memo: '' });
    odo = Math.round((odo + km) * 10) / 10;
  };
  const d = new Date(2026, 7, 1), end = parseD(TODAY);
  while (d <= end) {
    const ds = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const wd = d.getDay();
    if (wd >= 1 && wd <= 5) {
      const m = 30 + Math.floor(R() * 20);
      add(ds, 'home', 'hq', `07:${pad(m)}`, 'private', '출퇴근');
      if (ds === TODAY) break;                       // 오늘은 오전 출근까지만 기록됨
      if (R() < 0.7) {
        const dest = ['cA', 'site', 'wh'][Math.floor(R() * 3)];
        const cat = { cA: '고객 방문', site: '현장 점검', wh: '물품 배송' }[dest];
        add(ds, 'hq', dest, `10:${pad(10 + Math.floor(R() * 40))}`, 'business', cat);
        add(ds, dest, 'hq', `13:${pad(Math.floor(R() * 50))}`, 'business', cat);
      }

function stats(ym) {
  const list = TRIPS.filter(t => t.date.startsWith(ym));

  const uncCount = list.filter(t => !t.purpose).length;
  const pct = total ? Math.round(biz / total * 1000) / 10 : 0;
  const odoStart = list.length ? list[0].odoStart : 0, odoEnd = list.length ? list[list.length - 1].odoEnd : 0;
  return { list, total, biz, pri, unc, uncCount, pct, count: list.length, odoStart, odoEnd };
}

function MapSvg(seed, h = 180) {
  const R = rng(seed);
  const pts = []; let x = 40, y = h - 36;
  for (let i = 0; i < 6; i++) { pts.push([x, y]); x += 45 + R() * 10; y = Math.max(30, Math.min(h - 30, y - 10 - R() * 40 + (i % 2 ? 22 : 0))); }
  pts.push([310, 34]);
  const roads = Array.from({ length: 7 }, (_, i) => `<path d="M${-20 + i * 60} ${h} L${40 + i * 60} 0" stroke="#E3E7EC" stroke-width="7"/>`).join('') +
                Array.from({ length: 4 }, (_, i) => `<path d="M0 ${30 + i * 45} L343 ${10 + i * 45}" stroke="#E3E7EC" stroke-width="5"/>`).join('');
  const [sx, sy] = pts[0], [ex, ey] = pts[pts.length - 1];
  return `<svg viewBox="0 0 343 ${h}" width="100%" height="${h}" class="block" preserveAspectRatio="xMidYMid slice">
    <rect width="343" height="${h}" fill="#EEF1F4"/>${roads}
    <path d="M250 ${h} q30 -40 93 -50 v50z" fill="#D7E6F3"/>
    <polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#E96E0A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${sx}" cy="${sy}" r="7" fill="#fff" stroke="#20262D" stroke-width="3"/>
    <circle cx="${ex}" cy="${ey}" r="8" fill="#E96E0A" stroke="#fff" stroke-width="3"/>
  </svg>`;
}

/* ---------- 운행 시뮬레이션 ---------- */
function refreshDriveUi() {
  if (cur() === 'home' && STACK.length === 1) refresh();
}
function demoBoard() {
  const d = S.drive;
  const last = TRIPS[TRIPS.length - 1];
  d.from = last ? last.to : 'hq';
  d.state = 'driving'; d.sec = 0; d.km = 0; d.startHm = NOW_HM;
  banner('차량 연결됨 · 운행 기록 시작', `${myVehicle()?.model || '차량'} 시동 ON을 감지했어요. 자동으로 운행을 기록합니다.`);
  refreshDriveUi();
  clearInterval(d.timer);
  d.timer = setInterval(() => {
    // 데모 가속: 실제 1초 = 주행 1분
    d.sec += 60; d.km += 0.55 + Math.random() * 0.25;
    const t = $('liveTime'), k = $('liveKm');
    if (t) t.textContent = Math.floor(d.sec / 60);
    if (k) k.textContent = fmtKm(d.km);
  }, 1000);
}
function demoAlight() {
  const d = S.drive;
  clearInterval(d.timer);
  d.state = 'ending'; d.countdown = 3;
  refreshDriveUi();
  clearInterval(d.endTimer);
  d.endTimer = setInterval(() => {
    d.countdown--;
    const c = $('endCount'), b = $('endBar');
    if (c) c.textContent = d.countdown + '초';
    if (b) b.style.width = ((3 - d.countdown) / 3 * 100) + '%';
    if (d.countdown <= 0) { clearInterval(d.endTimer); finishTrip(); }
  }, 1000);
}
function finishTrip() {
  const d = S.drive;
  const km = Math.max(1.2, Math.round(d.km * 10) / 10);
  const to = d.from === 'hq' ? 'cA' : 'hq';
  const last = TRIPS[TRIPS.length - 1];
  const odo = last ? last.odoEnd : 48000;
  const t = { id: 't' + (TRIPS.length + 1000), date: TODAY, from: d.from, to, start: d.startHm, end: addMin(d.startHm, Math.max(1, d.sec / 60)), km, odoStart: odo, odoEnd: Math.round((odo + km) * 10) / 10, purpose: null, cat: '', memo: '', fresh: true };
  TRIPS.push(t);
  d.state = 'idle';
  refreshDriveUi();
  banner('운행이 종료되었어요', `${PL[t.from].n} → ${PL[t.to].n} · ${fmtKm(km)} km. 업무용인지 개인용인지 선택해 주세요.`, () => openPurposeSheet(t.id, { auto: true }));
  setTimeout(() => openPurposeSheet(t.id, { auto: true }), 700);
}

/* ---------- 운행 목적 선택 시트 ---------- */
let PS = null;   // { id, purpose, cat, auto }
function openPurposeSheet(id, opts = {}) {
  const t = TRIPS.find(x => x.id === id);
  PS = { id, purpose: t.purpose, cat: t.cat, auto: !!opts.auto, memo: t.memo || '' };
  drawPurposeSheet();
}
function drawPurposeSheet() {
  const t = TRIPS.find(x => x.id === PS.id);
  const opt = (key, label, desc, icon) => {
    const on = PS.purpose === key;
    return `<button onclick="psPick('${key}')" class="flex-1 rounded-[16px] border-2 ${on ? 'border-brand bg-peach' : 'border-line bg-white'} px-4 py-[18px] flex flex-col items-start gap-[10px] text-left transition-colors">
      <span class="w-[44px] h-[44px] rounded-[12px] ${on ? 'bg-brand' : 'bg-chip'} flex items-center justify-center">${icon(on ? '#fff' : '#20262D', 24)}</span>
      <span class="flex flex-col gap-[2px]"><span class="text-[17px] font-black ${on ? 'text-brand' : 'text-ink'}">${label}</span><span class="text-[12px] text-sub leading-[16px]">${desc}</span></span>
    </button>`;
  };
  const cats = PS.purpose ? CATS[PS.purpose] : [];
  openSheet(`
    <div class="px-6 pt-2 pb-8 flex flex-col gap-5">
      <div class="flex items-start justify-between">
        <div class="flex flex-col gap-1">
          <span class="text-[13px] font-bold text-brand">${PS.auto ? '운행 종료' : t.purpose ? '운행 목적 변경' : '운행 목적 선택'}</span>
          <h3 class="text-[22px] font-black text-ink leading-[30px]">이번 운행은<br/>어떤 목적이었나요?</h3>
        </div>
        ${PS.auto ? '' : `<button onclick="closeSheet()" class="w-9 h-9 rounded-full bg-chip flex items-center justify-center">${I.x()}</button>`}
      </div>
      <div class="rounded-[14px] bg-page px-4 py-[14px] flex flex-col gap-[6px]">
        <div class="flex items-center justify-between"><span class="text-[13px] text-sub">${fmtDate(t.date)} · ${t.start}–${t.end}</span><span class="text-[14px] font-black text-ink">${fmtKm(t.km)} km</span></div>
        <span class="text-[15px] font-bold text-ink">${PL[t.from].n} → ${PL[t.to].n}</span>
        <span class="text-[12px] text-sub">주행거리계 ${fmtOdo(t.odoStart)} → ${fmtOdo(t.odoEnd)} km</span>
      </div>
      <div class="flex gap-3">
        ${opt('business', '업무용', '고객 방문, 배송 등<br/>업무 목적 운행', I.brief)}
        ${opt('private', '개인용', '출퇴근, 개인 용무 등<br/>사적 사용', I.person)}
      </div>
      ${PS.purpose ? `
      <div class="flex flex-col gap-[10px] fade-in">
        <span class="text-[13px] font-bold text-ink">세부 목적</span>
        <div class="flex flex-wrap gap-2">
          ${cats.map(c => `<button onclick="psCat('${c}')" class="h-[36px] px-[14px] rounded-full text-[13px] font-bold border ${PS.cat === c ? 'bg-ink text-white border-ink' : 'bg-white text-ink border-line'}">${c}</button>`).join('')}
        </div>
        ${PS.purpose === 'private' ? `<p class="text-[12px] text-sub leading-[17px] bg-page rounded-[10px] px-3 py-[10px]">자택↔근무지 출퇴근은 FBT 기준 개인(사적) 사용으로 분류돼요.</p>` : ''}
        <input id="psMemo" value="${esc(PS.memo)}" oninput="PS.memo=this.value" placeholder="메모 (선택) · 예: ○○사 납품 미팅" class="h-[48px] rounded-[12px] bg-white border border-line px-4 text-[14px] text-ink placeholder:text-[#A3AAB3]" />
      </div>` : ''}
      <div class="flex flex-col gap-2 pt-1">
        <button onclick="psSave()" ${PS.purpose ? '' : 'disabled'} class="w-full h-[54px] rounded-[14px] bg-brand text-white text-[16px] font-bold disabled:bg-[#F3C9A6]">저장</button>
        ${PS.auto ? `<button onclick="psLater()" class="h-[44px] text-[14px] font-bold text-sub">나중에 선택</button>` : ''}
      </div>
    </div>`, { locked: PS.auto });
}
function psPick(p) { if (PS.purpose !== p) PS.cat = ''; PS.purpose = p; if (!PS.cat) PS.cat = CATS[p][0]; keepMemo(); redrawSheet(); }
function psCat(c) { PS.cat = c; keepMemo(); redrawSheet(); }
function keepMemo() { const m = $('psMemo'); if (m) PS.memo = m.value; }
function redrawSheet() { const sc = $('sheet').scrollTop; drawPurposeSheet(); $('sheet').scrollTop = sc; }
function psSave() {
  keepMemo();
  const t = TRIPS.find(x => x.id === PS.id);
  t.purpose = PS.purpose; t.cat = PS.cat; t.memo = PS.memo; delete t.fresh;
  closeSheet();
  toast(`${PS.purpose === 'business' ? '업무용' : '개인용'} 운행으로 저장했어요`);
  PS = null; refresh();
}
function psLater() { closeSheet(); toast('미분류로 저장했어요. 운행기록에서 언제든 선택할 수 있어요'); PS = null; refresh(); }

function validAbn(a) {
  const d = String(a).replace(/\D/g, '');

    <button onclick="deleteVehicle('${v.id}')" class="h-[44px] text-[14px] font-bold text-warn mt-2">차량 삭제</button>
  </div>`);
}
function assignVehicle(vid, uid) {
  if (uid) VEHICLES.forEach(v => { if (v.userId === uid && v.id !== vid) v.userId = ''; });
  VEHICLES.find(v => v.id === vid).userId = uid;
  toast(uid ? `${userById(uid).name}님에게 배정했어요` : '배정을 해제했어요');
  openVehicleSheet(vid); refresh();
}
function deleteVehicle(vid) {
  const v = VEHICLES.find(x => x.id === vid);
  openSheet(`<div class="px-6 pt-2 pb-8 flex flex-col gap-4">
    <h3 class="text-[20px] font-black text-ink">${esc(v.rego)} 차량을 삭제할까요?</h3>
    <p class="text-[14px] text-sub">삭제해도 이미 기록된 운행일지는 유지돼요.</p>
    <div class="grid grid-cols-2 gap-2">${BtnGhost('취소', `openVehicleSheet('${vid}')`)}<button onclick="VEHICLES.splice(VEHICLES.findIndex(x=>x.id==='${vid}'),1);closeSheet();toast('차량을 삭제했어요');refresh()" class="h-[54px] rounded-[14px] bg-warn text-white text-[16px] font-bold">삭제</button></div>
  </div>`);
}

/* ---------- 사용자 관리 ---------- */
SCREENS.users = () => `
  ${TopBar('사용자 관리', `<button onclick="openInviteSheet()" class="w-9 h-9 rounded-full bg-brand flex items-center justify-center" aria-label="사용자 초대">${I.plus('#fff', 18)}</button>`)}
  <div class="px-6 flex flex-col gap-3 pt-1">
    <p class="text-[14px] text-sub">회사 차량을 사용하는 임직원을 초대하고 권한을 관리하세요.</p>
    <div class="rounded-[14px] bg-white border border-line px-5">
      ${USERS.map(u => { const v = VEHICLES.find(x => x.userId === u.id); return `
        <button onclick="openUserSheet('${u.id}')" class="w-full flex items-center gap-3 py-[14px] border-b border-line last:border-b-0 text-left">
          <span class="w-10 h-10 rounded-full ${u.role === 'admin' ? 'bg-ink text-white' : 'bg-chip text-ink'} flex items-center justify-center text-[15px] font-black shrink-0">${esc(u.name[0])}</span>
          <span class="flex-1 min-w-0 flex flex-col gap-[2px]">
            <span class="flex items-center gap-[6px]"><span class="text-[15px] font-bold text-ink">${esc(u.name)}</span>
              ${u.role === 'admin' ? `<span class="text-[10px] px-[6px] py-[1px] rounded-[5px] bg-ink text-white font-bold">관리자</span>` : ''}
              ${u.status === 'invited' ? `<span class="text-[10px] px-[6px] py-[1px] rounded-[5px] bg-peach text-brand font-bold">초대됨</span>` : ''}</span>
            <span class="text-[12px] text-sub truncate">${esc(u.email)}</span>
            <span class="text-[12px] text-sub">${v ? `${v.model} · ${v.rego}` : '배정 차량 없음'}</span>
          </span>${I.chev()}
        </button>`; }).join('')}
    </div>
    <button onclick="openInviteSheet()" class="h-[54px] rounded-[14px] border-2 border-dashed border-line text-[15px] font-bold text-sub flex items-center justify-center gap-2 mt-1">${I.plus('#626B76', 16)}사용자 초대</button>
  </div>`;

let INV = null;
function openInviteSheet() {
  if (!INV) INV = { name: '', email: '', role: 'user' };
  openSheet(`<div class="px-6 pt-2 pb-8 flex flex-col gap-4">
    <div class="flex items-start justify-between"><h3 class="text-[22px] font-black text-ink">사용자 초대</h3><button onclick="INV=null;closeSheet()" class="w-9 h-9 rounded-full bg-chip flex items-center justify-center">${I.x()}</button></div>
    <label class="flex flex-col gap-[6px]"><span class="text-[13px] font-bold text-ink">이름</span><input id="invName" value="${esc(INV.name)}" oninput="INV.name=this.value" placeholder="홍길동" class="h-[52px] rounded-[14px] bg-white border border-line px-4 text-[15px] text-ink placeholder:text-[#A3AAB3]" /></label>
    <label class="flex flex-col gap-[6px]"><span class="text-[13px] font-bold text-ink">이메일</span><input id="invEmail" type="email" value="${esc(INV.email)}" oninput="INV.email=this.value" placeholder="name@company.com.au" class="h-[52px] rounded-[14px] bg-white border border-line px-4 text-[15px] text-ink placeholder:text-[#A3AAB3]" /></label>
    <div class="flex flex-col gap-[6px]"><span class="text-[13px] font-bold text-ink">권한</span>
      <div class="flex gap-2">${[['user', '일반 사용자'], ['admin', '관리자']].map(([k, l]) => `<button onclick="INV.role='${k}';openInviteSheet()" class="flex-1 h-[44px] rounded-[12px] text-[14px] font-bold ${INV.role === k ? 'bg-ink text-white' : 'bg-white border border-line text-ink'}">${l}</button>`).join('')}</div>
      <span class="text-[12px] text-sub">${INV.role === 'admin' ? '관리자는 사업자 정보·차량·사용자를 관리할 수 있어요.' : '일반 사용자는 본인 운행기록과 보고서만 볼 수 있어요.'}</span>
    </div>
    ${BtnPrimary('초대 메일 보내기', 'sendInvite()')}
  </div>`);
}
function sendInvite() {
  const name = INV.name.trim(), email = INV.email.trim();
  if (!name) { toast('이름을 입력해 주세요'); return; }
  if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { toast('이메일 형식을 확인해 주세요'); return; }
  USERS.push({ id: 'u' + (USERS.length + 1) + (Date.now() % 1000), name, email, role: INV.role, status: 'invited' });
  INV = null; closeSheet(); toast(`${name}님에게 초대 메일을 보냈어요`); refresh();
}
function openUserSheet(id) {
  const u = userById(id), isMe = u.id === S.me.id;
  const v = VEHICLES.find(x => x.userId === u.id);
  openSheet(`<div class="px-6 pt-2 pb-8 flex flex-col gap-4">
    <div class="flex items-start justify-between">
      <div class="flex items-center gap-3">
        <span class="w-12 h-12 rounded-full ${u.role === 'admin' ? 'bg-ink text-white' : 'bg-chip text-ink'} flex items-center justify-center text-[18px] font-black">${esc(u.name[0])}</span>
        <div class="flex flex-col"><span class="text-[19px] font-black text-ink">${esc(u.name)}${isMe ? ' (나)' : ''}</span><span class="text-[13px] text-sub">${esc(u.email)}</span></div>
      </div>
      <button onclick="closeSheet()" class="w-9 h-9 rounded-full bg-chip flex items-center justify-center">${I.x()}</button>
    </div>
    <div class="rounded-[14px] bg-page px-4 py-3 flex flex-col gap-1 text-[14px]">
      <div class="flex justify-between"><span class="text-sub">상태</span><b class="text-ink">${u.status === 'invited' ? '초대 수락 대기' : '사용 중'}</b></div>
      <div class="flex justify-between"><span class="text-sub">배정 차량</span><b class="text-ink">${v ? `${v.model} · ${v.rego}` : '없음'}</b></div>
    </div>
    <div class="flex flex-col gap-[6px]"><span class="text-[13px] font-bold text-ink">권한</span>
      <div class="flex gap-2 ${isMe ? 'opacity-40 pointer-events-none' : ''}">${[['user', '일반 사용자'], ['admin', '관리자']].map(([k, l]) => `<button onclick="setRole('${u.id}','${k}')" class="flex-1 h-[44px] rounded-[12px] text-[14px] font-bold ${u.role === k ? 'bg-ink text-white' : 'bg-white border border-line text-ink'}">${l}</button>`).join('')}</div>
      ${isMe ? `<span class="text-[12px] text-sub">본인 권한은 변경할 수 없어요.</span>` : ''}
    </div>
    ${u.status === 'invited' ? BtnGhost('초대 메일 다시 보내기', `toast('초대 메일을 다시 보냈어요')`) : ''}
    ${isMe ? '' : `<button onclick="removeUser('${u.id}')" class="h-[44px] text-[14px] font-bold text-warn">사용자 삭제</button>`}
  </div>`);
}
function setRole(id, role) { userById(id).role = role; toast('권한을 변경했어요'); openUserSheet(id); refresh(); }
function removeUser(id) {
  const u = userById(id);
  openSheet(`<div class="px-6 pt-2 pb-8 flex flex-col gap-4">
    <h3 class="text-[20px] font-black text-ink">${esc(u.name)}님을 삭제할까요?</h3>
    <p class="text-[14px] text-sub">배정된 차량은 미배정 상태로 바뀌고, 제출된 운행일지는 유지돼요.</p>
    <div class="grid grid-cols-2 gap-2">${BtnGhost('취소', `openUserSheet('${id}')`)}<button onclick="doRemoveUser('${id}')" class="h-[54px] rounded-[14px] bg-warn text-white text-[16px] font-bold">삭제</button></div>
  </div>`);
}
function doRemoveUser(id) { VEHICLES.forEach(v => { if (v.userId === id) v.userId = ''; }); USERS.splice(USERS.findIndex(u => u.id === id), 1); closeSheet(); toast('사용자를 삭제했어요'); refresh(); }

/* ---------------- Boot ---------------- */
STACK = [{ id: 'login' }];
render();
</script>
</body>
</html>
